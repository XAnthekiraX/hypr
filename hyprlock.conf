# ==============================================================================
# HYPRLOCK CONFIG - ESTILO CAELESTIA (DARK GLASSMORPHISM)
# Compatible con Hyprland 0.55.4+ y hyprlock v0.5+
# ==============================================================================

general {
    disable_loading_bar = true
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

# ------------------------------------------------------------------------------
# FONDO: Desenfoque profundo con textura y vibrancia controlada
# ------------------------------------------------------------------------------
background {
    monitor = 
    # Cambia esta ruta a tu wallpaper real (preferiblemente uno oscuro/abstracto)
    path = ~/.config/hypr/wallpaper.jpg 
    
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.85
    brightness = 0.6
    vibrancy = 0.25
    vibrancy_darkness = 0.4
}

# ------------------------------------------------------------------------------
# PANEL CENTRAL: Efecto cristal esmerilado (Glassmorphism)
# ------------------------------------------------------------------------------
shape {
    monitor = 
    size = 480, 400
    rounding = 28
    border_size = 1
    border_color = rgba(ffffff12)
    
    # Color base oscuro con alta transparencia
    color = rgba(11111b85) 
    
    position = 0, 0
    halign = center
    valign = center
    
    # Sombras suaves para elevar el panel
    shadow_passes = 4
    shadow_size = 20
    shadow_color = rgba(00000060)
    shadow_boost = 1.2
}

# ------------------------------------------------------------------------------
# ETIQUETAS: Tipografía limpia y jerárquica
# ------------------------------------------------------------------------------

# Hora principal
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ff)
    font_size = 82
    # Asegúrate de tener estas fuentes instaladas (Geist o Inter son ideales)
    font_family = Geist, Inter, JetBrains Mono
    position = 0, 70
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000050)
}

# Fecha y día
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = rgba(a6adc8cc)
    font_size = 18
    font_family = Geist, Inter, sans-serif
    position = 0, 15
    halign = center
    valign = center
}

# Mensaje de estado / Greeting (Opcional, estilo Caelestia)
label {
    monitor = 
    text = cmd[update:3000] echo "$(echo $USER | awk '{print toupper(substr($0,0,1)) tolower(substr($0,2))}'), welcome back."
    color = rgba(7f849ccc)
    font_size = 13
    font_family = Geist, Inter, sans-serif
    position = 0, -30
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# CAMPO DE ENTRADA: Minimalista, integrado, con feedback visual
# ------------------------------------------------------------------------------
input-field {
    monitor = 
    size = 340, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    
    # Colores adaptados a tema oscuro (Catppuccin Mocha / Nord inspirado)
    outer_color = rgba(89b4fa50)
    inner_color = rgba(313244cc)
    font_color = rgba(cdd6f4ff)
    
    # Feedback de estados
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>Contraseña incorrecta</i>
    capslock_color = rgba(f9e2afcc)
    
    # Animaciones y placeholder
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Ingresa tu contraseña...</i>
    hide_input = false
    
    position = 0, -110
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000040)
}
